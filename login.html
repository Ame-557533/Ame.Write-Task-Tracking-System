<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ame Co. — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="#" class="nav-logo">
      <div class="nav-mark"><span>A</span></div>
      <span class="nav-name">Ame Co.</span>
    </a>
  </nav>

  <!--Card-->
  <div class="card">

    <!--SVG icon definitions (hidden, referenced via <use>)-->
    <svg style="display:none">
      <symbol id="ico-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </symbol>
      <symbol id="ico-check" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </symbol>
      <symbol id="ico-arrow-left" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </symbol>
      <symbol id="ico-eye" viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </symbol>
      <symbol id="ico-eye-off" viewBox="0 0 24 24">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </symbol>
    </svg>

    <!--LOGIN VIEW-->
    <div id="view-login" class="view active">
      <div class="card-header">
        <div class="card-logo"><span>A</span></div>
        <h1 class="card-title">Welcome back</h1>
        <p class="card-sub">Sign in to your Ame Co. account</p>
      </div>

      <div class="banner" id="login-banner">
        <svg><use href="#ico-alert"/></svg>
        <span id="login-banner-msg"></span>
      </div>

      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="l-pw">Password</label>
        <div class="pw-wrap">
          <input type="password" id="l-pw" placeholder="••••••••" autocomplete="current-password" />
          <button class="pw-toggle" onclick="togglePw('l-pw', this)" type="button" aria-label="Show password">
            <svg><use href="#ico-eye"/></svg>
          </button>
        </div>
        <div class="forgot-row">
          <button class="link-btn" onclick="show('forgot')" type="button">Forgot password?</button>
        </div>
      </div>

      <button class="btn-primary" id="login-btn" onclick="doLogin()" type="button">Sign in</button>

      <div class="divider">or</div>

      <p class="card-footer">
        Don't have an account?&nbsp;
        <button class="link-btn" onclick="show('signup')" type="button">Create one</button>
      </p>
    </div>

    <!--FORGOT PASSWORD VIEW-->
    <div id="view-forgot" class="view">
      <button class="back-btn" onclick="show('login')" type="button">
        <svg><use href="#ico-arrow-left"/></svg>
        Back to sign in
      </button>

      <div class="card-header">
        <div class="card-logo"><span>A</span></div>
        <h1 class="card-title">Reset password</h1>
        <p class="card-sub">We'll send a reset link to your email</p>
      </div>

      <div class="banner" id="forgot-banner">
        <svg><use href="#ico-alert"/></svg>
        <span id="forgot-banner-msg"></span>
      </div>

      <div class="field">
        <label for="f-email">Email address</label>
        <input type="email" id="f-email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-err" id="f-email-err">
          <svg><use href="#ico-alert"/></svg>
          <span></span>
        </div>
      </div>

      <button class="btn-primary" onclick="doForgot()" type="button">Send reset link</button>
    </div>

    <!--CREATE ACCOUNT VIEW-->
    <div id="view-signup" class="view">
      <button class="back-btn" onclick="show('login')" type="button">
        <svg><use href="#ico-arrow-left"/></svg>
        Back to sign in
      </button>

      <div class="card-header">
        <div class="card-logo"><span>A</span></div>
        <h1 class="card-title">Create account</h1>
        <p class="card-sub">Get started with Ame Co. for free</p>
      </div>

      <div class="banner" id="signup-banner">
        <svg><use href="#ico-check"/></svg>
        <span id="signup-banner-msg"></span>
      </div>

      <div class="field">
        <label for="s-name">Full name</label>
        <input type="text" id="s-name" placeholder="Jane Smith" autocomplete="name" />
        <div class="field-err" id="s-name-err">
          <svg><use href="#ico-alert"/></svg>
          <span></span>
        </div>
      </div>

      <div class="field">
        <label for="s-email">Email</label>
        <input type="email" id="s-email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-err" id="s-email-err">
          <svg><use href="#ico-alert"/></svg>
          <span></span>
        </div>
      </div>

      <div class="field">
        <label for="s-pw">Password</label>
        <div class="pw-wrap">
          <input type="password" id="s-pw" placeholder="Min. 8 characters" oninput="checkStrength(this.value)" autocomplete="new-password" />
          <button class="pw-toggle" onclick="togglePw('s-pw', this)" type="button" aria-label="Show password">
            <svg><use href="#ico-eye"/></svg>
          </button>
        </div>
        <div class="strength-bar">
          <div class="s-seg" id="s0"></div>
          <div class="s-seg" id="s1"></div>
          <div class="s-seg" id="s2"></div>
          <div class="s-seg" id="s3"></div>
        </div>
        <p class="pw-hint" id="str-label"></p>
        <div class="field-err" id="s-pw-err">
          <svg><use href="#ico-alert"/></svg>
          <span></span>
        </div>
      </div>

      <div class="field">
        <label for="s-pw2">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="s-pw2" placeholder="••••••••" autocomplete="new-password" />
          <button class="pw-toggle" onclick="togglePw('s-pw2', this)" type="button" aria-label="Show password">
            <svg><use href="#ico-eye"/></svg>
          </button>
        </div>
        <div class="field-err" id="s-pw2-err">
          <svg><use href="#ico-alert"/></svg>
          <span></span>
        </div>
      </div>

      <button class="btn-primary" onclick="doSignup()" type="button">Create account</button>
    </div>

  </div>

  <p class="page-footer">&copy; 2026 Ame Co. All rights reserved.</p>

  <script>
    /*Demo credentials*/
    const DEMO = { email: 'user@example.com', password: 'password123' };

    /*View switching*/
    function show(v) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + v).classList.add('active');
      clearAll();
    }

    /*Clear all errors & banners*/
    function clearAll() {
      document.querySelectorAll('.banner').forEach(el => {
        el.style.display = 'none';
        el.className = 'banner';
      });
      document.querySelectorAll('.field-err').forEach(el => el.style.display = 'none');
      document.querySelectorAll('input').forEach(el => el.classList.remove('err'));
    }

    /*Show banner*/
    function showBanner(id, type, msg) {
      const el = document.getElementById(id);
      const msgEl = document.getElementById(id + '-msg');
      el.className = 'banner ' + type;
      el.style.display = 'flex';
      msgEl.textContent = msg;
      const use = el.querySelector('use');
      use.setAttribute('href', type === 'error' ? '#ico-alert' : '#ico-check');
    }

    /*Show field error*/
    function fieldErr(inputId, errId, msg) {
      document.getElementById(inputId).classList.add('err');
      const el = document.getElementById(errId);
      el.style.display = 'flex';
      el.querySelector('span').textContent = msg;
    }

    /*Toggle password visibility*/
    function togglePw(inputId, btn) {
      const inp = document.getElementById(inputId);
      const showing = inp.type === 'text';
      inp.type = showing ? 'password' : 'text';
      btn.querySelector('use').setAttribute('href', showing ? '#ico-eye' : '#ico-eye-off');
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }

    /*Email validator*/
    function isEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    /*Login*/
    function doLogin() {
      clearAll();
      const em = document.getElementById('l-email').value.trim();
      const pw = document.getElementById('l-pw').value;
      let ok = true;

      if (!em || !isEmail(em)) { document.getElementById('l-email').classList.add('err'); ok = false; }
      if (!pw) { document.getElementById('l-pw').classList.add('err'); ok = false; }
      if (!ok) { showBanner('login-banner', 'error', 'Please fill in all fields correctly.'); return; }
      if (em !== DEMO.email) {
        showBanner('login-banner', 'error', 'No account found with that email address.');
        document.getElementById('l-email').classList.add('err');
        return;
      }
      if (pw !== DEMO.password) {
        showBanner('login-banner', 'error', 'Incorrect password. Please try again.');
        document.getElementById('l-pw').classList.add('err');
        return;
      }
      showBanner('login-banner', 'success', 'Signed in successfully! Redirecting…');
      document.getElementById('login-btn').disabled = true;
    }

    /*Forgot password*/
    function doForgot() {
      clearAll();
      const em = document.getElementById('f-email').value.trim();
      if (!em || !isEmail(em)) { fieldErr('f-email', 'f-email-err', 'Please enter a valid email address.'); return; }
      showBanner('forgot-banner', 'success', 'Reset link sent — check your inbox.');
    }

    /*Password strength*/
    function checkStrength(v) {
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const colors = ['#e24b4a', '#ef9f27', '#1d9e75', '#0f6e56'];
      const labels = ['Too short', 'Weak', 'Good', 'Strong'];
      for (let i = 0; i < 4; i++) {
        document.getElementById('s' + i).style.background =
          i < score ? colors[Math.min(score - 1, 3)] : 'rgba(0,0,0,0.09)';
      }
      document.getElementById('str-label').textContent = v.length ? labels[Math.min(score, 3)] : '';
    }

    /*Sign up*/
    function doSignup() {
      clearAll();
      const name = document.getElementById('s-name').value.trim();
      const em   = document.getElementById('s-email').value.trim();
      const pw   = document.getElementById('s-pw').value;
      const pw2  = document.getElementById('s-pw2').value;
      let ok = true;

      if (!name) { fieldErr('s-name', 's-name-err', 'Full name is required.'); ok = false; }
      if (!em || !isEmail(em)) { fieldErr('s-email', 's-email-err', 'Enter a valid email address.'); ok = false; }
      if (pw.length < 8) { fieldErr('s-pw', 's-pw-err', 'Password must be at least 8 characters.'); ok = false; }
      else if (pw2 && pw !== pw2) { fieldErr('s-pw2', 's-pw2-err', 'Passwords do not match.'); ok = false; }
      if (!ok) return;

      showBanner('signup-banner', 'success', 'Account created! Redirecting to sign in…');
      setTimeout(() => show('login'), 2200);
    }
  </script>

</body>
</html>
